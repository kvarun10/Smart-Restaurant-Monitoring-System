[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tablewatch"
version = "0.1.0"
description = "Restaurant table state detection (occupied / clean / dirty) with dirty-table alerts"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "opencv-python-headless"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
